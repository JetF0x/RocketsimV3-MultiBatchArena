[package]
name = "rocketsim_batch_py"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Python bindings for rocketsim_batch"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
rocketsim_batch = { path = "../rocketsim_batch" }

[lints.clippy]
all = "warn"

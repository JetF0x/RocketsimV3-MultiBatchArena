[package]
name = "rocketsim_batch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Step many RocketSim v3 arenas in parallel with flat, RL-friendly buffers"
license = "MIT"
publish = false

[dependencies]
core_affinity = "0.8"
log = "0.4"
num_cpus = "1"
rayon.workspace = true
rocketsim = { path = "../vendor/rocketsim" }

[lints.clippy]
all = "warn"
